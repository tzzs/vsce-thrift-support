name: publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  package:
    # Publish only for the root VS Code extension release. release-please also
    # creates component releases for packages/core and packages/cli.
    if: ${{ startsWith(github.event.release.tag_name, 'thrift-support-v') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: cd packages/core && npx tsc -p .

      - name: Build
        run: pnpm run build --if-present

      - name: Read version from release tag
        id: pkg
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#thrift-support-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version ${PACKAGE_VERSION} does not match release tag version ${RELEASE_VERSION}." >&2
            exit 1
          fi

      - name: Package VSIX
        run: npx @vscode/vsce package -o thrift-support-${{ steps.pkg.outputs.version }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-artifact
          path: thrift-support-${{ steps.pkg.outputs.version }}.vsix
          if-no-files-found: error

  github_release:
    needs: package
    if: ${{ startsWith(github.event.release.tag_name, 'thrift-support-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-artifact
          path: .

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: thrift-support-${{ needs.package.outputs.version }}.vsix
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vsce_publish:
    needs: [ package, github_release ]
    if: ${{ startsWith(github.event.release.tag_name, 'thrift-support-v') }}
    runs-on: ubuntu-latest
    environment: vsce
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.VSCE_TOKEN }}
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-artifact
          path: .

      - name: Ensure VSCE token present
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT/VSCE_TOKEN is not configured in repository or environment 'vsce'." >&2
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --skip-duplicate --packagePath thrift-support-${{ needs.package.outputs.version }}.vsix

  openvsx_publish:
    needs: [ package, github_release ]
    if: ${{ startsWith(github.event.release.tag_name, 'thrift-support-v') }}
    runs-on: ubuntu-latest
    environment: vsce
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT || secrets.OPENVSX_TOKEN }}
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-artifact
          path: .

      - name: Ensure Open VSX token present
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "OVSX_PAT/OPENVSX_TOKEN is not configured in repository or environment 'vsce'." >&2
            exit 1
          fi

      - name: Publish to Open VSX
        run: npx ovsx publish --skip-duplicate --packagePath thrift-support-${{ needs.package.outputs.version }}.vsix

  npm_publish:
    needs: [ package, github_release ]
    if: ${{ startsWith(github.event.release.tag_name, 'thrift-support-v') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync sub-package versions
        run: node scripts/sync-versions.js

      - name: Build core
        run: cd packages/core && npx tsc -p .

      - name: Build CLI
        run: cd packages/cli && node build.js

      - name: Verify CLI
        run: |
          node packages/cli/dist/cli.js --version
          node packages/cli/dist/cli.js format --check test-files/example-enum.thrift

      # Auth via npm OIDC trusted publishing (configured on npmjs.com for this
      # repo + publish.yml + environment "npm"). id-token:write lets pnpm fetch
      # the OIDC token; --provenance is signed automatically.
      #
      # The Setup Node.js step deliberately omits registry-url. OIDC does not
      # need an auth line in .npmrc, and not writing one keeps the auth path
      # independent of pnpm version (pnpm <11.1.3 would have treated the
      # unresolved ${NODE_AUTH_TOKEN} placeholder as a literal bearer token,
      # silently skipping the OIDC fallback and failing with an npm 404).
      - name: Publish CLI to npm
        run: cd packages/cli && pnpm publish --no-git-checks --provenance --access public
