name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: cd packages/core && npx tsc -p .

      - name: Lint
        run: pnpm run lint

      - name: Invisible Unicode scan
        run: pnpm run security:unicode

      - name: Dependency audit
        run: pnpm run security:audit

      - name: Build
        run: pnpm run build

      - name: Build CLI
        run: cd packages/cli && node build.js

      - name: Build CLI TypeScript
        run: pnpm exec tsc -p packages/cli/tsconfig.json

      - name: Run tests
        run: pnpm test

      - name: Plugin coverage
        run: pnpm run coverage

      - name: CLI coverage
        run: pnpm run coverage:cli

      - name: CLI dogfood
        run: |
          node packages/cli/dist/cli.js --version
          node packages/cli/dist/cli.js format --check test-files/example-enum.thrift
          node packages/cli/dist/cli.js lint test-files/example-enum.thrift
          node packages/cli/dist/cli.js symbols test-files/example-enum.thrift

      - name: Package smoke
        run: pnpm run smoke:package

      - name: Performance benchmark
        run: pnpm run perf:benchmark -- --iterations 5

      - name: Performance assertions (multi-size)
        run: pnpm exec mocha --require tests/require-hook.js --timeout 120000 tests/perf/perf-assertions.js
